methodology_version: 2.0.0
score_kind: editorial_descriptive
base:
  pillar_weights:
    value: 0.3333
    quality: 0.3333
    momentum: 0.3334
  peer_frame: sector
  winsorize:
    lower: 0.01
    upper: 0.99
  quality_margin: operating
  momentum_secondary_global: true
social_tilt:
  tilt_max: 10
  beta: 1.3
  shape: tanh
  symmetric: true
  dampener_neg_share_pivot: 0.5
shrinkage:
  k: 10
  prior: 50
  display_badges:
    sparse_below: 5
    ok_at: 15
social_pipeline:
  sources:
  - reddit
  - stocktwits
  include_wsb: true
  source_cap_per_ticker_day: 0.5
  mention_transform: log1p_then_universe_share
  reddit_comments: false
  sentiment_engagement_weight: 1+log1p(upvotes)
universe:
  scope:
  - US
  - ADR
  min_market_cap_usd: 1.0e9
  min_adv_usd_20d: 5.0e6
  min_names_per_sector: 30
  target_size:
  - 400
  - 500
placeholder: true
